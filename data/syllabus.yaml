# GS Mains syllabus (Papers II–IV) from the CSE notification. Line IDs are this site's labels.
- id: GS1-L1
  text: Indian culture will cover the salient aspects of Art Forms, Literature and Architecture from ancient to modern times.
- id: GS1-L2
  text: Modern Indian history from about the middle of the eighteenth century until the present- significant events, personalities, issues
- id: GS1-L3
  text: The Freedom Struggle - its various stages and important contributors /contributions from different parts of the country.
- id: GS1-L4
  text: Post-independence consolidation and reorganization within the country.
- id: GS1-L5
  text: History of the world will include events from 18th century such as industrial revolution, world wars, redrawal of national boundaries, colonization, decolonization, political philosophies like communism, capitalism, socialism etc.- their forms and effect on the society.
- id: GS1-L6
  text: Salient features of Indian Society, Diversity of India.
- id: GS1-L7
  text: Role of women and women's organization, population and associated issues, poverty and developmental issues, urbanization, their problems and their remedies.
- id: GS1-L8
  text: Effects of globalization on Indian society
- id: GS1-L9
  text: Social empowerment, communalism, regionalism & secularism.
- id: GS1-L10
  text: Salient features of world's physical geography.
- id: GS1-L11
  text: Distribution of key natural resources across the world (including South Asia and the Indian sub-continent); factors responsible for the location of primary, secondary, and tertiary sector industries in various parts of the world (including India)
- id: GS1-L12
  text: Important Geophysical phenomena such as earthquakes, Tsunami, Volcanic activity, cyclone etc., geographical features and their location- changes in critical geographical features (including water-bodies and ice-caps) and in flora and fauna and the effects of such changes.
- id: GS2-L1
  text: Indian Constitution- historical underpinnings, evolution, features, amendments, significant provisions and basic structure.
- id: GS2-L2
  text: Functions and responsibilities of the Union and the States, issues and challenges pertaining to the federal structure, devolution of powers and finances up to local levels and challenges therein.
- id: GS2-L3
  text: Separation of powers between various organs dispute redressal mechanisms and institutions.
- id: GS2-L4
  text: Comparison of the Indian constitutional scheme with that of other countries
- id: GS2-L5
  text: Parliament and State Legislatures - structure, functioning, conduct of business, powers & privileges and issues arising out of these.
- id: GS2-L6
  text: Structure, organization and functioning of the Executive and the Judiciary Ministries and Departments of the Government; pressure groups and formal/informal associations and their role in the Polity.
- id: GS2-L7
  text: Salient features of the Representation of People's Act.
- id: GS2-L8
  text: Appointment to various Constitutional posts, powers, functions and responsibilities of various Constitutional Bodies.
- id: GS2-L9
  text: Statutory, regulatory and various quasi-judicial bodies
- id: GS2-L10
  text: Government policies and interventions for development in various sectors and issues arising out of their design and implementation.
- id: GS2-L11
  text: Development processes and the development industry- the role of NGOs, SHGs, various groups and associations, donors, charities, institutional and other stakeholders
- id: GS2-L12
  text: Welfare schemes for vulnerable sections of the population by the Centre and States and the performance of these schemes; mechanisms, laws, institutions and Bodies constituted for the protection and betterment of these vulnerable sections.
- id: GS2-L13
  text: Issues relating to development and management of Social Sector/Services relating to Health, Education, Human Resources.
- id: GS2-L14
  text: Issues relating to poverty and hunger.
- id: GS2-L15
  text: Important aspects of governance, transparency and accountability, e-governance- applications, models, successes, limitations, and potential; citizens charters, transparency & accountability and institutional and other measures.
- id: GS2-L16
  text: Role of civil services in a democracy.
- id: GS2-L17
  text: India and its neighborhood- relations.
- id: GS2-L18
  text: Bilateral, regional and global groupings and agreements involving India and/or affecting India's interests
- id: GS2-L19
  text: Effect of policies and politics of developed and developing countries on India's interests, Indian diaspora.
- id: GS2-L20
  text: Important International institutions, agencies and fora- their structure, mandate.
- id: GS3-L1
  text: Indian Economy and issues relating to planning, mobilization of resources, growth, development and employment.
- id: GS3-L2
  text: Inclusive growth and issues arising from it.
- id: GS3-L3
  text: Government Budgeting.
- id: GS3-L4
  text: Major crops cropping patterns in various parts of the country, different types of irrigation and irrigation systems storage, transport and marketing of agricultural produce and issues and related constraints; e-technology in the aid of farmers
- id: GS3-L5
  text: Issues related to direct and indirect farm subsidies and minimum support prices; Public Distribution System- objectives, functioning, limitations, revamping; issues of buffer stocks and food security; Technology missions; economics of animal-rearing.
- id: GS3-L6
  text: Food processing and related industries in India- scope and significance, location, upstream and downstream requirements, supply chain management.
- id: GS3-L7
  text: Land reforms in India.
- id: GS3-L8
  text: Effects of liberalization on the economy, changes in industrial policy and their effects on industrial growth.
- id: GS3-L9
  text: 'Infrastructure: Energy, Ports, Roads, Airports, Railways etc.'
- id: GS3-L10
  text: Investment models.
- id: GS3-L11
  text: Science and Technology- developments and their applications and effects in everyday life
- id: GS3-L12
  text: Achievements of Indians in science & technology; indigenization of technology and developing new technology.
- id: GS3-L13
  text: Awareness in the fields of IT, Space, Computers, robotics, nano-technology, bio-technology and issues relating to intellectual property rights.
- id: GS3-L14
  text: Conservation, environmental pollution and degradation, environmental impact assessment
- id: GS3-L15
  text: Disaster and disaster management.
- id: GS3-L16
  text: Linkages between development and spread of extremism.
- id: GS3-L17
  text: Role of external state and non-state actors in creating challenges to internal security.
- id: GS3-L18
  text: Challenges to internal security through communication networks, role of media and social networking sites in internal security challenges, basics of cyber security; money-laundering and its prevention
- id: GS3-L19
  text: Security challenges and their management in border areas; linkages of organized crime with terrorism
- id: GS3-L20
  text: Various Security forces and agencies and their mandate
