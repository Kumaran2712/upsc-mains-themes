name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Defaults point at https://upscthemes.live/ (custom domain set under Settings → Pages).
          # Override any of them under Settings → Secrets and variables → Actions → Variables
          # (e.g. SITE_URL=https://your-domain.in and BASE_PATH=/ after moving to a custom domain).
          SITE_URL: ${{ vars.SITE_URL || 'https://upscthemes.live' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          PUBLIC_REPO_URL: ${{ vars.PUBLIC_REPO_URL || 'https://github.com/Kumaran2712/upsc-mains-themes' }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID || 'c104a33d-b914-48fa-ada3-62711142ce2c' }}
          # Search Console codes: upscthemes.live property, plus any set in the repo variable (old github.io property).
          PUBLIC_GOOGLE_SITE_VERIFICATION: SIbYIeZ8SfdwfIfdicb83XPAmhiXpboKzlPsyNULRyY,${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
